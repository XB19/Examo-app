spring.application.name=examo-backend

# Identifiants PostgreSQL : définis dans ./secrets.properties (ignoré par git)
spring.config.import=optional:file:./secrets.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/examo

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080

examo.storage-dir=./storage
examo.import-on-startup=true

# Photos des copies : 5 Mo max chacune (l'app les réduit avant envoi)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# IA : anthropic.api-key se définit dans secrets.properties
anthropic.model=claude-opus-5-5

# Lecture des dictées : elevenlabs.api-key se définit dans secrets.properties
# Voix "Alice - Clear, Engaging Educator" : voix premade (incluse sur tout compte,
# y compris gratuit), contrairement aux voix françaises de la bibliothèque partagée
# qui nécessitent un compte payant pour un usage via l'API.
elevenlabs.voice-id=Xb7hH8MSUJpSbSDYk0k2
elevenlabs.model-id=eleven_multilingual_v2
