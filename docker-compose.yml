services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: examo
      POSTGRES_USER: ${DB_USERNAME:-examo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définis DB_PASSWORD dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-examo} -d examo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/examo
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-examo}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Définis DB_PASSWORD dans .env}
      # Facultatives : laisser vide désactive proprement la fonctionnalité correspondante.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage

volumes:
  db_data:
  backend_storage:
